[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brace-lsr"
version = "0.1.0"
description = "BRACE retrieval for differentially private LSR dense associative memory"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "numpy",
    "pytest",
]

[project.scripts]
brace-lsr-demo = "brace_lsr.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
